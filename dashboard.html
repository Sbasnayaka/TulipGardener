<!DOCTYPE html>

            background: #B347FF;
            color: #fff;
            border: none;
            padding: 16px 36px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(179, 71, 255, 0.3);

        .welcome-go-btn.grow-btn:hover {
            background: #9d2ae8;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(179, 71, 255, 0.4);
        }

    <!-- Main Content -->
    <main class="dashboard-main-layout">

                <div class="oval-video-mask">
                    <video autoplay loop muted playsinline>

                </div>
                <!-- Binding to menu.html safely -->
                <a href="menu.html" class="welcome-go-btn grow-btn">Grow a new Tulip</a>
            </div>

            <!-- Divider Line -->
            <div class="dash-divider"></div>

            <!-- Column 2: Status -->
            <div class="dash-col dash-col-center" style="gap: 20px;">
                <h3 class="dash-status-title"
                    style="color: #fff; font-size: 1.1rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;">
                    Gardener Log</h3>

                <!-- Beautiful Stat Card 1 -->
                <div
                    style="background: rgba(20, 5, 30, 0.4); border: 1px solid rgba(179, 71, 255, 0.2); border-radius: 20px; padding: 25px; width: 100%; position: relative; overflow: hidden; backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">

                        style="font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px;">
                        Current Level</div>
                    <div id="level-badge"
                        style="font-size: 2.3rem; font-weight: 800; color: #fff; margin-bottom: 8px; line-height: 1;">
                        Beginner</div>
                    <div
                        style="font-size: 0.85rem; color: #B347FF; font-weight: 600; display: flex; align-items: center; gap: 5px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                            <polyline points="17 6 23 6 23 12"></polyline>
                        </svg>
                        Keep growing!
                    </div>
                    <svg style="position: absolute; right: 15px; top: 25px; opacity: 0.15;" width="50" height="50"
                        viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>

                <!-- Beautiful Stat Card 2 -->
                <div
                    style="background: rgba(20, 5, 30, 0.4); border: 1px solid rgba(160, 19, 236, 0.2); border-radius: 20px; padding: 25px; width: 100%; position: relative; overflow: hidden; backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                    <div
                        style="font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px;">
                        Total Tulips</div>
                    <div id="score-badge"
                        style="font-size: 2.3rem; font-weight: 800; color: #fff; margin-bottom: 8px; line-height: 1;">0
                    </div>
                    <div
                        style="font-size: 0.85rem; color: #FF3366; font-weight: 600; display: flex; align-items: center; gap: 5px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                        Planted in Garden
                    </div>
                    <svg style="position: absolute; right: 15px; top: 25px; opacity: 0.15;" width="50" height="50"
                        viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5">
                        <path d="M12 2C7 2 3 6 3 11c0 3 2 6 4 9h10c2-3 4-6 4-9 0-5-4-9-9-9z"></path>
                    </svg>
                </div>
            </div>

            <!-- Column 3: Garden Grid -->
            <div class="dash-col dash-col-right">
                <div class="garden-viewport">
                    <div class="garden-grid-scrollable" id="garden">
                        <!-- Dynamic content filled by JS -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Architecture -->
    <script src="js/services/supabaseClient.js"></script>
    <script src="js/services/UserService.js"></script>
    <script src="js/controllers/AuthController.js"></script>

    <!-- Background Petal Rain (Shared logic from menu.html) -->
    <script>
        function createShinyPetals() {
            const container = document.querySelector('.petals-container');
            if (!container) return;
            const petalCount = 120; // Generating over 100 petals

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('shiny-petal');

                const leftPos = Math.random() * 100;
                const animDuration = Math.random() * 12 + 8;
                const animDelay = Math.random() * 10;
                const scale = Math.random() * 0.2 + 0.1;

                petal.style.left = `${leftPos}vw`;
                petal.style.animationDuration = `${animDuration}s`;
                petal.style.animationDelay = `-${animDelay}s`;
                petal.style.setProperty('--scale-factor', scale);

                const initialRotation = Math.random() * 360;
                petal.style.setProperty('--rot-start', `${initialRotation}deg`);
                petal.style.setProperty('--rot-end', `${initialRotation + (Math.random() > 0.5 ? 360 : -360)}deg`);

                container.appendChild(petal);
            }
        }
        createShinyPetals();

        // Core Dashboard Logic Intact
        async function loadDashboard() {
            const authed = await AuthController.requireAuth();
            if (!authed) return;

            try {
                const profile = await UserService.getProfile();
                document.getElementById('score-badge').innerText = profile.score;

                // Determine level
                let level = 'Beginner';
                if (profile.score >= 6) level = 'Pro';
                else if (profile.score >= 3) level = 'Intermediate';
                document.getElementById('level-badge').innerText = level;

                // Render garden
                renderGarden(profile.score);
            } catch (e) {
                console.error('Dashboard load error:', e);
            }
        }

        // Updated Render Garden overriding simple emojis to use the PNG inside wireframe circles
        function renderGarden(score) {
            const grid = document.getElementById('garden');
            grid.innerHTML = '';

            // Generate minimum 9 slots to respect grid structure, but allow infinite scrolling
            const totalSlots = Math.max(9, score);

            for (let i = 0; i < totalSlots; i++) {
                const slot = document.createElement('div');
                slot.className = 'garden-wire-slot';

                if (i < score) {
                    // Randomize from a set of beautiful premium glowing colors
                    const glowColors = ['#FF3366', '#B347FF', '#FFB347', '#47B3FF', '#A013EC', '#FF47B3'];
                    const randoGlow = glowColors[Math.floor(Math.random() * glowColors.length)];

                    // Direct inject SVG with dynamic fill and the identical animation class
                    slot.innerHTML = `
                        <svg class="grown-tulip-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 60%; height: 60%; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));">
                            <!-- Beautiful glowing bloom -->
                            <path d="M50 85 C50 70, 45 60, 50 45" stroke="#2ecc71" stroke-width="4" fill="none"/>
                            <path d="M50 75 C30 65, 30 50, 50 70" fill="#2ecc71"/>
                            <path d="M50 65 C70 55, 70 40, 50 60" fill="#2ecc71"/>
                            <path d="M30 30 C30 60, 70 60, 70 30 Z" fill="${randoGlow}"/>
                            <path d="M30 30 Q40 10 50 30 Q60 10 70 30 Q60 40 50 30 Q40 40 30 30 Z" fill="${randoGlow}"/>
                            <path d="M40 30 Q50 5 60 30 Z" fill="#ffffff" fill-opacity="0.25"/>
                        </svg>
                    `;
                }
                grid.appendChild(slot);
            }
        }

        loadDashboard();
    </script>
