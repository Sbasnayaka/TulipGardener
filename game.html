<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Tulip Gardener</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Specific Game Page Styling Constraints */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Loading Blur State */
        .puzzle-blur {
            filter: blur(20px);
            transition: filter 1s ease-in-out;
        }

        .puzzle-loaded {
            filter: blur(0);
        }

        /* Submit Fade Out */
        .btn-fade {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        /* Times Up Blur Overlay */
        #timesup-overlay {
            position: fixed;
            inset: 0;
            z-index: 8000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(14, 2, 25, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            animation: fadeInOverlay 0.4s ease forwards;
        }

        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .timesup-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            animation: shakeIcon 0.5s ease;
        }

        @keyframes shakeIcon {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-15deg);
            }

            75% {
                transform: rotate(15deg);
            }
        }

        .timesup-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #FF3366;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .timesup-sub {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .timesup-countdown {
            margin-top: 24px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #B347FF;
        }

        /* Incorrect Answer Blur Overlay */
        #incorrect-overlay {
            position: fixed;
            inset: 0;
            z-index: 7000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(30, 0, 10, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeInOverlay 0.3s ease forwards;
        }

        .incorrect-icon {
            font-size: 4rem;
            animation: wrongShake 0.4s ease;
        }

        @keyframes wrongShake {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-12px);
            }

            40% {
                transform: translateX(12px);
            }

            60% {
                transform: translateX(-8px);
            }

            80% {
                transform: translateX(8px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .incorrect-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #FF3366;
            margin: 12px 0 8px 0;
            letter-spacing: 2px;
        }

        .incorrect-sub {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            letter-spacing: 1px;
        }


        /* Back Button Override for Game Page*/
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 50;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .back-btn:hover {
            transform: scale(1.08);
        }

        .game-card {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .question-card,
        .image-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-primary {
            background: #B347FF;
            border: none;
        }

        .btn-primary:hover {
            background: #A013EC;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <!-- Back Button -->
    <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
        <img src="assets/back.png" alt="Back" style="width: 20px; height: 20px; object-fit: contain;">
    </a>

    <!-- Background Image with 10% opacity overall -->
    <div class="video-container"
        style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden;">
        <!-- background-img3.png as requested with low opacity -->
        <img src="assets/background-img3.png" style="object-fit:cover; width:100%; height:100%; opacity: 0.9;"
            alt="Background">
        <!-- 10% dark overlay -->
        <div class="video-overlay"
            style="position:absolute; top:0; left:0; width:100%; height:100%; background: rgba(0, 0, 0, 0.9);"></div>
    </div>

    <!-- Raining Petals Container matching menu.html -->
    <div class="petals-container"
        style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:hidden;">
    </div>

    <script>
        // 100+ Shiny Petal Rain Simulation matching menu.html
        function createShinyPetals() {
            const container = document.querySelector('.petals-container');
            const petalCount = 120; // Generating over 100 petals

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('shiny-petal');

                // Randomly position across the entire viewport width
                const leftPos = Math.random() * 100;

                // Random duration between 8s and 20s for realistic floating
                const animDuration = Math.random() * 12 + 8;

                // Random delay to stagger the initial drop
                const animDelay = Math.random() * 10;

                // Random scale so petals look like individual small pieces or clumps
                const scale = Math.random() * 0.2 + 0.1;

                petal.style.left = `${leftPos}vw`;
                petal.style.animationDuration = `${animDuration}s`;
                petal.style.animationDelay = `-${animDelay}s`; // use negative delay so the screen is immediately populated
                petal.style.setProperty('--scale-factor', scale);

                // Randomly start with some rotation
                const initialRotation = Math.random() * 360;
                petal.style.setProperty('--rot-start', `${initialRotation}deg`);
                petal.style.setProperty('--rot-end', `${initialRotation + (Math.random() > 0.5 ? 360 : -360)}deg`);

                container.appendChild(petal);
            }
        }
        createShinyPetals();
    </script>

    <!-- ═══ Incorrect Answer Overlay ═══ -->
    <div id="incorrect-overlay">
        <div class="incorrect-icon">❌</div>
        <div class="incorrect-title">INCORRECT!</div>
        <div class="incorrect-sub">TRY AGAIN...</div>
    </div>

    <!-- ═══ Time's Up Overlay ═══ -->
    <div id="timesup-overlay">
        <div class="timesup-icon">⏰</div>
        <div class="timesup-title">TIME'S UP!</div>
        <div class="timesup-sub">RESTARTING PUZZLE...</div>
        <div class="timesup-countdown" id="timesup-counter">3</div>
    </div>

    <!-- ═══ Celebration Overlay ═══ -->
    <div id="celebration" class="celebration-overlay">
        <div class="emoji-watering">🚿</div>
        <div class="emoji-flower">🌷</div>
        <h2>Tulip Grown! 🎉</h2>
        <p style="color: #ccc; margin-top: 5px;">Score: <span id="celebration-score">0</span></p>
        <div style="display:flex; flex-direction:column; gap: 10px; margin-top: 15px;">
            <a href="dashboard.html" class="btn btn-primary" style="border-color: #fff; text-align:center;">Go to
                Garden</a>
            <button onclick="location.reload()" class="btn"
                style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color:#fff; padding: 12px; border-radius: 40px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s;"
                onmouseover="this.style.background='rgba(255,255,255,0.2)'"
                onmouseout="this.style.background='rgba(255,255,255,0.1)'">🌱 Play Another Round</button>
        </div>
    </div>

    <!-- ═══ Game UI ═══ -->
    <div class="container wide" style="z-index: 10; position:relative;">
        <div class="game-card">
            <!-- Header -->
            <div
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px;">
                <span id="game-mode-label" style="font-weight: 700; font-size: 1.2rem; color: #B347FF;">Beginner
                    Mode</span>
                <span id="timer-display" style="color: #fff; font-weight:800; font-size:1.3rem;">10s</span>
            </div>

            <div class="game-grid">
                <!-- Left: Question -->
                <div class="question-card">
                    <h3>What is the<br>value of <strong>'❤️'</strong>?</h3>

                    <input type="number" id="answer-input" class="form-control" placeholder="ex: 5"
                        style="text-align: center; font-size: 1.2rem; margin: 20px 0;">

                    <button id="submit-btn" class="btn btn-primary" style="width: 100%;">Submit</button>
                </div>

                <!-- Right: Image -->
                <div class="image-display" style="position:relative;">
                    <!-- Added puzzle-blur class for loading -->
                    <img id="puzzle-image" class="puzzle-blur" src="" alt="Loading puzzle...">
                    <div id="loading-overlay"
                        style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background: rgba(0,0,0,0.5); z-index:2; border-radius:15px; transition: opacity 0.5s;">
                        <p id="loading-text" style="color: #fff; font-weight:600;">Loading puzzle...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Architecture: Service Layer -->
    <script src="js/services/supabaseClient.js"></script>
    <script src="js/services/UserService.js"></script>
    <script src="js/services/HeartApiService.js"></script>
    <!-- Architecture: Controller Layer -->
    <script src="js/controllers/AuthController.js"></script>
    <script src="js/controllers/GameController.js"></script>

    <script>
        // Get mode from URL
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'beginner';

        // Update mode label
        document.getElementById('game-mode-label').innerText =
            mode.charAt(0).toUpperCase() + mode.slice(1) + ' Mode';

        // Create controller instance and initialize
        const gameCtrl = new GameController(mode);

        // Auth guard then init game
        (async () => {
            const authed = await AuthController.requireAuth();
            if (!authed) return;
            await gameCtrl.init();
            document.getElementById('loading-text').style.display = 'none';
        })();

        // Submit button
        document.getElementById('submit-btn').addEventListener('click', () => {
            const answer = document.getElementById('answer-input').value;
            gameCtrl.checkAnswer(answer);
        });

        // Also allow Enter key
        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const answer = document.getElementById('answer-input').value;
                gameCtrl.checkAnswer(answer);
            }
        });
    </script>
    <!-- Global Floating Action Buttons -->
    <div class="global-fab-container">
        <a href="menu.html" class="fab-btn fab-play" title="Play Game">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        </a>
        <a href="leaderboard.html" class="fab-btn fab-leaderboard" title="Leaderboard">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20v-6"></path>
                <path d="M6 20V10"></path>
                <path d="M18 20V4"></path>
            </svg>
        </a>
    </div>

    <!-- Global Copyright Footer -->
    <div class="global-copyright">
        &copy; sanduni kaveesha basnayaka 2541893 game project
    </div>
    <script src="js/controllers/AudioController.js"></script>
</body>

</html>
