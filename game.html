<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Tulip Gardener</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Specific Game Page Styling Constraints */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Loading Blur State */
        .puzzle-blur {
            filter: blur(20px);
            transition: filter 1s ease-in-out;
        }

        .puzzle-loaded {
            filter: blur(0);
        }

        /* Submit Fade Out */
        .btn-fade {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        /* Raining Petals Animation */
        .petal {
            position: absolute;
            background: rgba(255, 105, 180, 0.7);
            border-radius: 15px 0 15px 0;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 5;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Back Button Override */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 50;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #fff;
            color: #222;
        }

        .game-card {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .question-card,
        .image-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-primary {
            background: #B347FF;
            border: none;
        }

        .btn-primary:hover {
            background: #A013EC;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <!-- Back Button -->
    <a href="dashboard.html" class="back-btn" title="Back to Dashboard">←</a>

    <!-- Background Video with 20% opacity overall -->
    <div class="video-container"
        style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; opacity: 0.8;">
        <!-- V01.MOV as requested -->
        <video autoplay loop muted playsinline id="bg-video" style="object-fit:cover; width:100%; height:100%;">
            <source src="assets/background-%20V01.MOV" type="video/mp4">
        </video>
        <!-- 20% dark overly -> inverted to match the '20% transparency' user requested -->
        <div class="video-overlay"
            style="position:absolute; top:0; left:0; width:100%; height:100%; background: rgba(0, 0, 0, 0.8);"></div>
    </div>

    <!-- Raining Petals Container -->
    <div id="petals-container"
        style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;"></div>

    <script>
        // Raining Petals Engine
        const petalsContainer = document.getElementById('petals-container');
        for (let i = 0; i < 30; i++) {
            let petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = (Math.random() * 10 + 10) + 'px';
            petal.style.height = (Math.random() * 10 + 10) + 'px';
            petal.style.animationDuration = (Math.random() * 3 + 4) + 's';
            petal.style.animationDelay = (Math.random() * 5) + 's';
            petalsContainer.appendChild(petal);
        }
    </script>

    <!-- ═══ Celebration Overlay ═══ -->
    <div id="celebration" class="celebration-overlay">
        <div class="emoji-watering">🚿</div>
        <div class="emoji-flower">🌷</div>
        <h2>Tulip Grown! 🎉</h2>
        <p style="color: #ccc; margin-top: 5px;">Score: <span id="celebration-score">0</span></p>
        <a href="dashboard.html" class="btn btn-primary" style="margin-top: 15px; border-color: #fff;">Go to Garden</a>
    </div>

    <!-- ═══ Game UI ═══ -->
    <div class="container wide" style="z-index: 10; position:relative;">
        <div class="game-card">
            <!-- Header -->
            <div
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px;">
                <span id="game-mode-label" style="font-weight: 700; font-size: 1.2rem; color: #B347FF;">Beginner
                    Mode</span>
                <span id="timer-display" style="color: #fff; font-weight:800; font-size:1.3rem;">10s</span>
            </div>

            <div class="game-grid">
                <!-- Left: Question -->
                <div class="question-card">
                    <h3>What is the<br>value of <strong>'❤️'</strong>?</h3>

                    <input type="number" id="answer-input" class="form-control" placeholder="ex: 5"
                        style="text-align: center; font-size: 1.2rem; margin: 20px 0;">

                    <button id="submit-btn" class="btn btn-primary" style="width: 100%;">Submit</button>
                </div>

                <!-- Right: Image -->
                <div class="image-display" style="position:relative;">
                    <!-- Added puzzle-blur class for loading -->
                    <img id="puzzle-image" class="puzzle-blur" src="" alt="Loading puzzle...">
                    <div id="loading-overlay"
                        style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background: rgba(0,0,0,0.5); z-index:2; border-radius:15px; transition: opacity 0.5s;">
                        <p id="loading-text" style="color: #fff; font-weight:600;">Loading puzzle...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Architecture: Service Layer -->
    <script src="js/services/supabaseClient.js"></script>
    <script src="js/services/UserService.js"></script>
    <script src="js/services/HeartApiService.js"></script>
    <!-- Architecture: Controller Layer -->
    <script src="js/controllers/AuthController.js"></script>
    <script src="js/controllers/GameController.js"></script>

    <script>
        // Get mode from URL
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'beginner';

        // Update mode label
        document.getElementById('game-mode-label').innerText =
            mode.charAt(0).toUpperCase() + mode.slice(1) + ' Mode';

        // Create controller instance and initialize
        const gameCtrl = new GameController(mode);

        // Auth guard then init game
        (async () => {
            const authed = await AuthController.requireAuth();
            if (!authed) return;
            await gameCtrl.init();
            document.getElementById('loading-text').style.display = 'none';
        })();

        // Submit button
        document.getElementById('submit-btn').addEventListener('click', () => {
            const answer = document.getElementById('answer-input').value;
            gameCtrl.checkAnswer(answer);
        });

        // Also allow Enter key
        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const answer = document.getElementById('answer-input').value;
                gameCtrl.checkAnswer(answer);
            }
        });
    </script>
    <!-- Global Floating Action Buttons -->
    <div class="global-fab-container">
        <a href="menu.html" class="fab-btn fab-play" title="Play Game">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        </a>
        <a href="leaderboard.html" class="fab-btn fab-leaderboard" title="Leaderboard">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20v-6"></path>
                <path d="M6 20V10"></path>
                <path d="M18 20V4"></path>
            </svg>
        </a>
    </div>

    <!-- Global Copyright Footer -->
    <div class="global-copyright">
        &copy; sanduni kaveesha basnayaka 2541893 game project
    </div>
</body>

</html>
