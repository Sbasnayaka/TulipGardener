<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulip Gardener Home</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <!-- Using Poppins font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="home-body">
    <!-- Background with glowing circles -->
    <div class="home-glow-orb top-left"></div>
    <div class="home-glow-orb bottom-right"></div>
    <div class="home-glow-orb center-left"></div>
    <div class="home-glow-orb top-right"></div>

    <div class="home-wrapper">
        <!-- Big title box -->
        <header class="home-header-pill">
            <h1>Welcome to Tulip garden</h1>
        </header>

        <!-- Main card box -->
        <main class="home-main-card">
            <!-- Picture area -->
            <div class="home-image-container">
                <img src="assets/background-img1.png" alt="Glowing Tulip">
                <div class="home-chevron">
                    <!-- Arrow icon -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="7 13 12 18 17 13"></polyline>
                        <polyline points="7 6 12 11 17 6"></polyline>
                    </svg>
                </div>
            </div>

            <!-- Text area -->
            <div class="home-text-container">
                <h2>Solve the puzzles</h2>
                <p>Grow tulips</p>
            </div>

            <!-- Game button -->
            <!-- Go to loading page -->
            <a href="loading.html" class="home-explore-btn">
                Explore the Garden
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="margin-left:4px;">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </main>
    </div>

    <!-- Loading text at bottom -->
    <footer class="home-footer-loading">
        <p>LOADING.....</p>
    </footer>
    <!-- Common buttons on side -->
    <div class="global-fab-container">
        <a href="menu.html" class="fab-btn fab-play" title="Play Game">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        </a>
        <a href="leaderboard.html" class="fab-btn fab-leaderboard" title="Leaderboard">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20v-6"></path>
                <path d="M6 20V10"></path>
                <path d="M18 20V4"></path>
            </svg>
        </a>
    </div>

    <!-- Footer with name and ID -->
    <div class="global-copyright">
        &copy; sanduni kaveesha basnayaka 2541893 game project
    </div>
    <script src="js/controllers/AudioController.js"></script>
</body>
</html>
