    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/controllers/AuthController.js"></script>

    <script>
        AuthController.requireAuth();

        // Volume System Engine Setup
        document.addEventListener('DOMContentLoaded', () => {
            const volSlider = document.getElementById('music-volume');
            if (volSlider && window.globalAudio) {
                // Initialize visual slider track to match loaded AudioController state
                volSlider.value = Math.round(globalAudio.audio.volume * 100);

                // Listen for movement and seamlessly adjust music logic
                volSlider.addEventListener('input', (e) => {
                    const mappedVol = e.target.value / 100;
                    globalAudio.audio.volume = mappedVol;
                    localStorage.setItem('bgVolume', mappedVol); // Persist across visits endlessly
                });
            }
        });

        function createShinyPetals() {
            const container = document.querySelector('.petals-container');
            if (!container) return;
            for (let i = 0; i < 120; i++) {
                const petal = document.createElement('div');
                petal.classList.add('shiny-petal');
                const leftPos = Math.random() * 100;
                const animDuration = Math.random() * 12 + 8;
                const animDelay = Math.random() * 10;
                const scale = Math.random() * 0.2 + 0.1;
                petal.style.left = `${leftPos}vw`;
                petal.style.animationDuration = `${animDuration}s`;
                petal.style.animationDelay = `-${animDelay}s`;
                petal.style.setProperty('--scale-factor', scale);
                const initialRotation = Math.random() * 360;
                petal.style.setProperty('--rot-start', `${initialRotation}deg`);
                petal.style.setProperty('--rot-end', `${initialRotation + (Math.random() > 0.5 ? 360 : -360)}deg`);
                container.appendChild(petal);
            }
        }
        createShinyPetals();
    </script>
